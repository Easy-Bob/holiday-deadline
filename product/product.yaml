_ > nanoagent.plugin.v0001.ProductConfig:
tagline: "Business-day deadlines that respect every public holiday"
summary: "Ask for a deadline N business days (1-30) after a date in the US, Canada, the UK, Germany, France, Switzerland, Australia or New Zealand, optionally in a region such as DE-BY. Example: '5 business days after 2025-01-02 in Bavaria (DE-BY).' An agent applies the public holidays from Nager.Date, and a verifier recomputes the deadline."
highlights:
  - "Live public holiday data for eight countries and their regions"
  - "Regional, bank-only and weekend holidays all handled by clear rules"
  - "Every answer is checked against the holiday lists the agent read"
steps:
  - "Ask for a deadline, e.g. 5 business days after 2025-01-02 in Bavaria (DE-BY)"
  - "The agent fetches the holidays and counts the business days"
  - "It submits the deadline, and the verdict card shows whether it is right and why"
