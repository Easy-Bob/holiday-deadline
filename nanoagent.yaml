_ > nanoagent.plugin.v0001.ManifestConfig:
id: holiday-deadline
name: Holiday Deadline
version: 0.1.0
status: ready
spec: nanoagent.plugin/v0001

runtime > nanoagent.plugin.v0001.RuntimeConfig:
  type: mcp_stdio
  command: [uv, run, --frozen, python, -m, plugin]

permissions > nanoagent.plugin.v0001.PermissionsConfig:
  network > nanoagent.plugin.v0001.NetworkConfig:
    hosts: [date.nager.at]
  filesystem > nanoagent.plugin.v0001.FilesystemConfig:
    write: [workspace]

# One entry per contract.Tool; its input and output classes are contract.TOOLS's.
tools > dict[contract.Tool, nanoagent.plugin.v0001.ToolConfig]:
  pin_holidays:
    description: Pin the find-deadline task's answer key, the country's holidays from Nager.Date for the start's year and the next
  public_holidays:
    description: Get a country's holidays for one year from the Nager.Date public holidays API, each with its date, name, whether it is nationwide, its regions and its types; each lookup is receipted
  calendar:
    description: List every day of a month with its weekday

# One entry per contract.Task; its input class is contract.TASKS's.
tasks > dict[contract.Task, nanoagent.plugin.v0001.TaskConfig]:
  find-deadline:
    description: Find the date that is a given number of business days after a start date in a country and region, skipping weekends and the public holidays that apply there
    runner: agent
    tools: [public_holidays, calendar]
    reference: pin_holidays
    instructions: |-
      Goal. Find the deadline: the date of the Nth business day after the start date, in the given country and region.
      Counting. The start date itself never counts: begin with the day after it. A business day is a Monday to Friday that is not an applying holiday. Saturdays and Sundays never count, and a holiday that falls on a weekend changes nothing.
      Which holidays apply. A holiday applies only when its types include "Public" AND it is nationwide or its regions include the task's region. With region "", only nationwide public holidays apply. A holiday whose types are only Bank, Optional, School, Authorities or Observance does not apply. The same date can appear more than once (e.g. a nationwide Bank entry and a regional Public entry): it applies if any entry for it applies.
      Plan. One tool call per step: (1) public_holidays for the start's year; (2) if the count could pass New Year, public_holidays for the next year too; (3) calendar for any month you need to see the weekdays of; (4) submit.
      Submit. deadline as YYYY-MM-DD, and skipped_holidays: the dates of the applying holidays that fell on a weekday between the start and the deadline, oldest first ([] when none).
